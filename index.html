<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debug</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    pre  { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; border-radius: 6px; }
    .ok  { color: #2e7d32; } .bad { color: #c62828; }
    a.btn { display:inline-block; margin:8px 0; padding:10px 16px; background:#2e7d32; color:#fff; text-decoration:none; border-radius:6px; }
  </style>
</head>
<body>
  <h2>Debug page (version 3)</h2>
  <div id="out"></div>

  <script>
    const out = document.getElementById("out");
    function log(html) { out.innerHTML += html; }

    const params = new URLSearchParams(window.location.search);
    const recordId = params.get("record_id");

    const BASE = "https://sandbox.zohoapis.com/crm/v7/functions/test/actions/execute?auth_type=apikey&zapikey=1003.c35c292f0b39da5388e64f1ad249b72d.9df439ec00bce2fe71d325b5b32b7d9e";

    log("<h3>1. record_id read from page URL</h3><pre>" + recordId + "</pre>");

    if (!recordId) {
      log('<p class="bad">record_id is missing from the page URL. Check the link.</p>');
    } else {
      const finalUrl = BASE + "&record_id=" + encodeURIComponent(recordId);
      log("<h3>2. Full URL being called</h3><pre>" + finalUrl + "</pre>");
      log('<a class="btn" href="' + finalUrl + '" target="_blank">Open this URL directly (test)</a>');

      log("<h3>3. Attempt 1: normal request (tries to read the response)</h3>");
      fetch(finalUrl, { method: "GET" })
        .then(async (res) => {
          const text = await res.text();
          log('<p class="ok">Response received. HTTP status: ' + res.status + "</p><pre>" + text + "</pre>");
        })
        .catch((err) => {
          log('<p class="bad">Could not read the response: ' + err.message + "</p>" +
              "<p>This is usually a CORS block, not a function error. Trying attempt 2...</p>");

          log("<h3>4. Attempt 2: no-cors request (sends it, response hidden)</h3>");
          return fetch(finalUrl, { method: "GET", mode: "no-cors" })
            .then((res) => {
              log('<p>Request was sent. Response type: <b>' + res.type + "</b> (opaque is expected).</p>" +
                  "<p>Now check the function's execution logs in CRM to see if it ran.</p>");
            })
            .catch((err2) => {
              log('<p class="bad">Request could not even be sent: ' + err2.message + "</p>");
            });
        });
    }
  </script>
</body>
</html>
