<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you</title>
</head>
<body style="font-family:Arial,sans-serif;text-align:center;margin-top:80px;">
  <h2 id="msg">Processing your request...</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const recordId = params.get("record_id");

    const FUNCTION_URL = "https://sandbox.zohoapis.com/crm/v7/functions/test/actions/execute?auth_type=apikey&zapikey=1003.c35c292f0b39da5388e64f1ad249b72d.9df439ec00bce2fe71d325b5b32b7d9e";

    if (!recordId) {
      document.getElementById("msg").textContent = "Invalid link. Record ID is missing.";
    } else {
      fetch(FUNCTION_URL + "&record_id=" + encodeURIComponent(recordId), {
        method: "GET",
        mode: "no-cors"
      })
      .then(() => {
        document.getElementById("msg").textContent = "Thank you! Your response has been recorded!!.";
      })
      .catch(() => {
        document.getElementById("msg").textContent = "Something went wrong. Please try again.";
      });
    }
  </script>
</body>
</html>
