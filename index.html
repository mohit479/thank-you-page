<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thank you</title>
</head>
<body style="font-family:Arial,sans-serif;text-align:center;margin-top:80px;">
  <h2 id="msg">Processing your request...</h2>

  <script>
    // Read any value you pass in the email link, e.g. https://yourpage.com/?id=12345
    const params = new URLSearchParams(window.location.search);
    const recordId = params.get("id");

    // Paste your own standalone function URL here (with your zapikey)
    const FUNCTION_URL = "https://www.zohoapis.com/crm/v7/functions/YOUR_FUNCTION_NAME/actions/execute?auth_type=apikey&zapikey=YOUR_API_KEY";

    fetch(FUNCTION_URL + "&id=" + encodeURIComponent(recordId), {
      method: "GET",
      mode: "no-cors"   // fire the request without needing CORS headers
    })
    .then(() => {
      document.getElementById("msg").textContent = "Thank you! Your response has been recorded.";
    })
    .catch(() => {
      document.getElementById("msg").textContent = "Something went wrong. Please try again.";
    });
  </script>
</body>
</html>
